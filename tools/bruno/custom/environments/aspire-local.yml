name: aspire-local
variables:
  - name: baseUrl
    value: http://localhost:5000
  # devtoken: the collection script resolves DEVTOKEN_<PROFILE> from the .env; no login endpoint.
  - name: authMode
    value: devtoken
  - name: devtokenProfile
    value: user
  # Fixed ids of local/database/seed/0001__todos.sql (hex ids decoded as Ulid).
  - name: seedUserTodoId
    value: 01HWXHRB80000G000000000001
  - name: seedOperatorTodoId
    value: 01HWXHRB80000G000000000002
  - name: seedAdminTodoId
    value: 01HWXHRB80000G000000000003
  - name: seedDeletableTodoId
    value: 01HWXHRB80000G000000000004
